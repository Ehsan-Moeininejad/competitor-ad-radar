# رقبای شناخته‌شده به تفکیک ورتیکال (seed). رقبای جدید را سیستم خودش پیدا و دسته‌بندی می‌کند
# و در data/advertisers.json نگه می‌دارد؛ این فایل «حرف آخر» است.
#
# level:
#   own       → گروه دیجی‌کالا (برای سنجش حضور خودمان)
#   core      → رقیب مستقیم ای‌کامرس همه‌کاره / مارکت‌پلیس
#   vertical  → رقیب در یک ورتیکال مشخص
# domains: اگر مطمئن نیستید خالی بگذارید؛ names در متن کریتیو هم جست‌وجو می‌شوند.
# آخرین بازبینی: 2026-10 — دامنه‌هایی که با * علامت خورده‌اند تأیید مستقیم نشده‌اند.

verticals:
