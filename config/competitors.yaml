  marketplace:      {fa: "ای‌کامرس عمومی و مارکت‌پلیس", group: ecommerce, core: true}
  digital:          {fa: "دیجیتال و موبایل", group: ecommerce, core: true}
  home_appliances:  {fa: "خانه، آشپزخانه و لوازم خانگی", group: ecommerce, core: true}
