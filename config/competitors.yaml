  auto:             {fa: "خودرو و لوازم خودرو", group: ecommerce, core: false}
  tools:            {fa: "ابزارآلات و تجهیزات", group: ecommerce, core: false}
  pet:              {fa: "پت‌شاپ", group: ecommerce, core: false}
  supermarket:      {fa: "سوپرمارکت و کوییک‌کامرس", group: ecommerce, core: true}
  books_stationery: {fa: "کتاب و لوازم‌التحریر", group: ecommerce, core: false}
