# تنظیمات اصلی رادار تبلیغات رقبا
# هر چیزی را اینجا عوض کنید، از اجرای بعدی اعمال می‌شود.

publishers_sheet:
  # شیت پابلیشرها (باید Anyone with the link → Viewer باشد)
  id: "1hhjYpZV1bYaurhhTafeixLfczCh9fp9jBaAhY4Guke4"
  gid: "0"
  # اگر شیت ستون‌هایی با این نام‌ها داشته باشد، خوانده می‌شوند (حروف کوچک/بزرگ و فارسی/انگلیسی مهم نیست)
  # ستون دامنه/لینک الزامی است و خودکار پیدا می‌شود.
  optional_columns:
    category: ["category", "vertical", "دسته", "دسته بندی", "دسته‌بندی", "حوزه", "موضوع"]
    tier: ["tier", "rank", "traffic", "visits", "رتبه", "ترافیک", "بازدید"]
    pages: ["pages", "urls", "inner", "صفحات", "صفحه"]
  max_sites: 260          # سقف سایت در هر اجرا؛ اول همهٔ سایت‌های شیت، بعد لیست سیستم

schedule:
  timezone: "Asia/Tehran"
  report_after_hour: 19   # اجرایی که بعد از این ساعت باشد، گزارش روزانه و ایمیل هم می‌سازد
  min_gap_minutes: 90     # اگر اسکن قبلی کمتر از این فاصله شروع شده، اسکن تکراری انجام نمی‌شود

crawl:
  sessions:               # هر سایت با این پروفایل‌ها دیده می‌شود
    - mobile_cold         # موبایل، بدون سابقه
    - desktop_cold        # دسکتاپ، بدون سابقه
    - mobile_warm         # موبایل، بعد از بازدید از سایت رقبا (برای کشف ریتارگتینگ)
  inner_pages: 0          # فقط صفحهٔ اصلی (مهم‌ترین اینونتوری). برای دیدن صفحهٔ داخلی (مقاله) عدد 1 بگذارید
  concurrency: 5
  max_minutes: 110        # سقف زمان اسکن؛ سایت‌های باقی‌مانده به اجرای بعد می‌روند (اول شیت، بعد لیست سیستم)
  page_timeout_sec: 35
  settle_sec: 5           # صبر بعد از لود برای رسیدن تبلیغات
  scroll_steps: 6
  screenshots: true
  max_screens_per_page: 25
  landing_pages:
    enabled: true         # لینک پشت تبلیغ را مستقیم (بدون کلیک روی تبلیغ) باز می‌کند و آفر/نوع لندینگ را درمی‌آورد
    max_per_run: 45
    strip_tracking: true  # UTM و پارامترهای ردیابی قبل از بازدید حذف می‌شوند تا آمار تبلیغ‌دهنده آلوده نشود

retention:
  raw_days: 3             # دادهٔ خام (هر اسلات، هر اسکرین‌شات) فقط ۳ روز نگه داشته می‌شود
  daily_days: 31          # خلاصهٔ روزانه یک ماه نگه داشته می‌شود و اینسایت ماهانه از آن ساخته می‌شود

scoring:
  # وزن جایگاه‌ها در محاسبهٔ سهم دیده‌شدن (Share of Voice)
  placement_weight:
    popup: 1.6
    sticky: 1.4
    header: 1.5
    above_fold: 1.3
    in_content: 1.1
    in_feed: 1.0
    sidebar: 0.8
    below_fold: 0.7
    footer: 0.4
  surge_threshold: 0.5    # رشد ۵۰٪ سهم رقیب نسبت به میانگین ۷ روز → هشدار

email:
  subject_prefix: "رادار تبلیغات رقبا"
  attach_html: false

report:
  title: "رادار تبلیغات رقبا"
  brand: "Digikala Performance"
